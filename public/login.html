<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Right Head CRM</title>
<link rel="icon" type="image/png" href="Right head Logo.png">
<link rel="stylesheet" href="login.css">
</head>
<body>
<form id="form" class="card" autocomplete="off">
  <div class="login-brand">
    <img src="Right head Logo.png" alt="Right Head Logo" class="login-logo">
    <h1>Right Head CRM</h1>
  </div>
  <p>Enter the company password to continue.</p>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" autofocus required>
  <div id="error" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
  <p class="company-links"><a href="mailto:contact@righthead.in">contact@righthead.in</a><br><a href="https://rightheadindia.in" target="_blank" rel="noopener noreferrer">Website</a> · <a href="https://www.linkedin.com/company/righthead" target="_blank" rel="noopener noreferrer">LinkedIn</a> · <a href="https://www.instagram.com/right.head_hr/?hl=en" target="_blank" rel="noopener noreferrer">Instagram</a></p>
</form>
<script src="login.js"></script>
</body>
</html>
