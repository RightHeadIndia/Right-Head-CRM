<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Right Head CRM</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="login.css">
</head>
<body>
<form id="form" class="card" autocomplete="off">
  <div class="login-brand">
    <img src="logo.png" alt="Right Head Logo" class="login-logo">
    <h1>Right Head CRM</h1>
  </div>
  <p>Enter the company password to continue.</p>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" autofocus required>
  <div id="error" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script src="login.js"></script>
</body>
</html>
