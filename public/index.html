<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Right Head CRM</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <img src="logo.png" alt="Right Head" class="brand-logo">
    <span id="brandName">Right Head CRM</span>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">Reminders are checked every minute while this tab is open.<br><button class="btn small" style="margin-top:8px" onclick="logout()">Log out</button></div>
</aside>
<main>
  <header>
    <h1 id="pageTitle">Dashboard</h1>
    <div class="head-actions">
      <input id="search" placeholder="Search name, company, phone, email...">
      <button class="btn primary" onclick="openClient()">+ Add Client</button>
    </div>
  </header>
  <section id="view"></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="tools.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
