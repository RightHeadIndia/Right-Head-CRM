<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Right Head CRM</title>
<link rel="icon" type="image/png" href="Right head Logo.png">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('crm-theme') || 'light'; } catch (_) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <img src="Right head Logo.png" alt="Right Head" class="brand-logo">
    <span id="brandName">Right Head CRM</span>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">Reminders are checked every minute while this tab is open.<br><a href="mailto:contact@righthead.in">contact@righthead.in</a><br><a href="https://rightheadindia.in" target="_blank" rel="noopener noreferrer">Website</a> · <a href="https://www.linkedin.com/company/righthead" target="_blank" rel="noopener noreferrer">LinkedIn</a> · <a href="https://www.instagram.com/right.head_hr/?hl=en" target="_blank" rel="noopener noreferrer">Instagram</a><br><button class="btn small" style="margin-top:8px" onclick="logout()">Log out</button></div>
</aside>
<main>
  <header>
    <h1 id="pageTitle">Dashboard</h1>
    <div class="head-actions">
      <input id="search" placeholder="Search name, company, phone, email...">
      <div class="notification-anchor">
        <button id="notificationButton" class="notification-button" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notificationPanel" onclick="toggleNotifications()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="notificationCount" class="notification-count" hidden></span>
        </button>
        <section id="notificationPanel" class="notification-panel" role="region" aria-label="Notifications" aria-live="polite" hidden></section>
      </div>
      <button id="themeToggle" class="btn" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark mode</button>
      <button id="addClientButton" class="btn primary" onclick="openClient()">+ Add Client</button>
    </div>
  </header>
  <section id="view"></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="tools.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
